# Sobe a API (que também serve o React) + MySQL.
# Nenhuma porta é publicada no host: só o Caddy (rede "proxy") enxerga o app,
# e o MySQL fica isolado na rede interna "interna".

services:
  app:
    build: .
    container_name: ${APP_CONTAINER:-agenda-app}
    restart: unless-stopped
    env_file: .env                 # .env de produção, criado a partir de .env.production.example
    environment:
      NODE_ENV: production
      DB_HOST: db                  # nome do serviço abaixo, resolvido pelo DNS interno do Docker
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy # só sobe depois que o MySQL responde (senão a migration falha)
    networks:
      - interna
      - proxy

  db:
    image: mysql:8.4
    container_name: ${DB_CONTAINER:-agenda-db}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      TZ: America/Sao_Paulo
    volumes:
      - db_data:/var/lib/mysql     # dados persistem entre deploys
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - interna

volumes:
  db_data:

networks:
  interna:
  proxy:
    external: true                 # criada uma vez com: docker network create proxy
